// ====== ROUTING: link diretto per articolo e per argomento ======
function slugify(s){ return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60)||"articolo"; }
function articlePath(item){ return "/articolo/"+item.id+"/"+slugify(item.title); }
function articleFullUrl(item){ return window.location.origin+articlePath(item); }
function topicPath(cat){ return "/argomento/"+encodeURIComponent(cat); }
function topicFullUrl(cat){ return window.location.origin+topicPath(cat); }
function parsePath(){ const p=(window.location.pathname||"/"); if(p.indexOf("/articolo/")===0){ const id=decodeURIComponent(p.slice("/articolo/".length).split("/")[0]); return {name:"article",id:id}; } if(p.indexOf("/argomento/")===0){ const cat=decodeURIComponent(p.slice("/argomento/".length).split("/")[0]); return {name:"topic",cat:cat}; } return {name:"home"}; }
function copyToClipboard(url,onOk,onFail){ (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(onOk).catch(()=>{ try{ window.prompt("Copia il link:",url); }catch(e){} if(onFail)onFail(); }); }

// ====== TESTO FORMATTATO (rich text) ======
function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function plainToHtml(s){ return escapeHtml(s).replace(/\n/g,"<br>"); }
function htmlToText(html){ try{ const d=document.createElement("div"); d.innerHTML=html||""; return (d.textContent||d.innerText||"").replace(/\s+\n/g,"\n").trim(); }catch(e){ return ""; } }
function sanitizeHtml(html){ try{ const d=document.createElement("div"); d.innerHTML=html||""; d.querySelectorAll("script,style,iframe,object,embed,link,meta").forEach(n=>n.remove()); d.querySelectorAll("*").forEach(el=>{ Array.prototype.slice.call(el.attributes).forEach(a=>{ const n=a.name.toLowerCase(); if(n.indexOf("on")===0||((n==="href"||n==="src")&&/^\s*javascript:/i.test(a.value))) el.removeAttribute(a.name); }); }); return d.innerHTML; }catch(e){ return escapeHtml(htmlToText(html)); } }
function hasRich(html){ const t=htmlToText(html); return !!(html&&html.trim())&&(/[<]/.test(html)); }

            <button onClick={()=>go("social")} style={menuItem}>Social</button>

          {query&&<span onClick={()=>setQuery("")} style={{cursor:"pointer",display:"flex"}}><Ic n="x" s={17} c={C.gray}/></span>}
        </div>
        <div style={{display:"flex",gap:8,overflowX:"auto",paddingBottom:6,marginBottom:16}}>
          {["Tutte",...CATEGORIES].map(c=>{ const on=activeCat===c; return <button key={c} onClick={()=>openTopic(c)} style={{whiteSpace:"nowrap",border:"1px solid "+(on?C.navy:C.line),background:on?C.navy:C.card,color:on?"#fff":C.navySoft,borderRadius:999,padding:"7px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>{c}</button>; })}
        </div>
        {activeCat!=="Tutte"&&!query&&<div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:10,flexWrap:"wrap",background:C.card,border:"1px solid "+C.line,borderRadius:12,padding:"10px 14px",marginBottom:16}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}><Pill c={activeCat}/><span style={{fontFamily:"Anton",fontSize:18,color:C.navy}}>{activeCat}</span><span style={{fontSize:13,color:C.gray}}>{filtered.length} {filtered.length===1?"articolo":"articoli"}</span></div>
          <button onClick={()=>copyTopicLink(activeCat)} style={{display:"inline-flex",alignItems:"center",gap:6,background:C.cream,color:C.navy,border:"1px solid "+C.line,borderRadius:10,padding:"8px 12px",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"Barlow"}}><Ic n="link" s={15} c={C.navy}/> Copia link argomento</button>
        </div>}
        {loading? <div style={{textAlign:"center",padding:60,color:C.gray}}>Caricamento…</div>
          : filtered.length===0? <Empty admin={admin} gate={adminGate} hasNews={news.length>0} onAdd={()=>{setEditing(null);setShowForm(true);}} onLogin={()=>setShowLogin(true)}/>
          : <React.Fragment>
              {featured&&!query&&activeCat==="Tutte"&&<Card item={featured} big admin={admin} onOpen={openArticle} onCopy={copyArticleLink} onPlay={setVideo} onEdit={(i)=>{setEditing(i);setShowForm(true);}} onDelete={removeItem}/>}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(270px, 1fr))",gap:14,marginTop:16}}>
                {(query||activeCat!=="Tutte"?filtered:rest).map(n=><Card key={n.id} item={n} admin={admin} onOpen={openArticle} onCopy={copyArticleLink} onPlay={setVideo} onEdit={(i)=>{setEditing(i);setShowForm(true);}} onDelete={removeItem}/>)}
              </div>
            </React.Fragment>}
      </main>
      )}

      <SiteFooter info={info} admin={admin} onEdit={()=>setShowInfo(true)}/>

      {showForm&&admin&&<NewsForm initial={editing} token={token} onClose={()=>{setShowForm(false);setEditing(null);}} onSave={saveItem}/>}
      {showInfo&&admin&&<InfoModal initial={info} onClose={()=>setShowInfo(false)} onSave={saveInfo}/>}
      {video&&<VideoModal item={video} onClose={()=>setVideo(null)}/>}
      {showLogin&&!admin&&<LoginModal onClose={()=>setShowLogin(false)} onLogin={doLogin}/>}

      {toast&&<div style={{position:"fixed",bottom:20,left:"50%",transform:"translateX(-50%)",background:C.navy,color:"#fff",padding:"11px 18px",borderRadius:10,fontSize:14,fontWeight:600,zIndex:80,maxWidth:"90vw",textAlign:"center"}}>{toast}</div>}
      <style>{`*{box-sizing:border-box}*::-webkit-scrollbar{height:6px;width:6px}*::-webkit-scrollbar-thumb{background:${C.line};border-radius:3px}html{scroll-behavior:smooth}html,body{margin:0;padding:0;width:100%;max-width:100%;overflow-x:hidden}img,iframe,video{max-width:100%}@media(max-width:560px){.tagline{display:none}.btn-label{display:none}}.article-body h2{font-family:Anton;font-weight:400;font-size:24px;color:${C.navy};margin:22px 0 8px;line-height:1.15}.article-body h3{font-family:Anton;font-weight:400;font-size:19px;color:${C.navy};margin:18px 0 6px;line-height:1.2}.article-body p{margin:0 0 14px}.article-body ul,.article-body ol{margin:0 0 14px;padding-left:22px}.article-body li{margin:4px 0}.article-body a{color:${C.blueDeep};font-weight:600}.article-body blockquote{border-left:4px solid ${C.amber};margin:16px 0;padding:8px 16px;color:${C.navy};font-style:italic;background:${C.cream};border-radius:0 8px 8px 0}.article-body hr{border:none;border-top:1px solid ${C.line};margin:22px 0}.article-body img{border-radius:12px;margin:8px 0}.article-body b,.article-body strong{color:${C.navy}}.rich-input:empty:before{content:"Scrivi qui l'articolo…";color:${C.gray}}.rich-input h2{font-family:Anton;font-weight:400;font-size:22px;color:${C.navy};margin:14px 0 6px}.rich-input h3{font-family:Anton;font-weight:400;font-size:18px;color:${C.navy};margin:12px 0 6px}.rich-input ul,.rich-input ol{padding-left:22px}.rich-input a{color:${C.blueDeep}}.rich-input blockquote{border-left:4px solid ${C.amber};margin:12px 0;padding:6px 14px;font-style:italic;background:#fff;border-radius:0 8px 8px 0}.rich-input hr{border:none;border-top:1px solid ${C.line};margin:16px 0}`}</style>
    </div>
  );
}

function Logo({info,admin,token,onSaveLogo,onHome}){
  const [adjust,setAdjust]=useState(false);
  const [busy,setBusy]=useState(false);
  const cfg=info.logo_cfg||DEFAULT_INFO.logo_cfg;
  const upload=async(e)=>{ const f=e.target.files&&e.target.files[0]; if(!f)return; setBusy(true); try{ const url=await apiUpload(token,f,"logo"); await onSaveLogo(url,cfg); }catch(err){ alert("Errore caricamento logo:\n\n"+(err.message||err)); } setBusy(false); };
  const Word=()=>(<div onClick={onHome} style={{lineHeight:1.1,cursor:"pointer"}}><div style={{fontFamily:"Anton",fontSize:21,letterSpacing:.3}}><span style={{color:C.blue}}>IA</span><span style={{color:C.navy}}>ttualità</span></div><div className="tagline" style={{fontSize:9.5,color:C.gray,marginTop:3}}>L'informazione intelligente e in tempo reale</div></div>);
  const Box=()=> info.logo_url? <div onClick={onHome} style={{width:44,height:44,borderRadius:10,background:"#fff",flexShrink:0,border:"1px solid "+C.line,overflow:"hidden",cursor:"pointer",backgroundImage:"url("+info.logo_url+")",backgroundRepeat:"no-repeat",backgroundSize:(cfg.scale*100)+"%",backgroundPosition:cfg.x+"% "+cfg.y+"%"}}/> : null;

  if(!admin) return <div style={{display:"flex",alignItems:"center",gap:10}}><Box/><Word/></div>;
  return (
    <div style={{display:"flex",alignItems:"center",gap:10,position:"relative"}}>
      {info.logo_url? <Box/> : <label style={{width:44,height:44,borderRadius:10,background:"#fff",border:"2px dashed "+C.line,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,cursor:"pointer"}}><Ic n="plus" s={20} c={C.blue}/><input type="file" accept="image/*" onChange={upload} style={{display:"none"}}/></label>}
      <Word/>
      {info.logo_url&&<button onClick={()=>setAdjust(v=>!v)} style={{background:"none",border:"1px solid "+C.line,borderRadius:8,padding:5,cursor:"pointer",display:"flex"}}><Ic n="edit" s={13} c={C.gray}/></button>}
      {adjust&&info.logo_url&&(
        <div style={{position:"absolute",top:52,left:0,zIndex:30,background:"#fff",border:"1px solid "+C.line,borderRadius:12,padding:14,width:250,boxShadow:"0 8px 24px rgba(22,36,63,.15)"}}>
          <div style={{fontSize:13,fontWeight:700,color:C.navy,marginBottom:10}}>Centra l'icona</div>
          {["scale","x","y"].map(k=>{ const lab={scale:"Zoom",x:"Orizzontale",y:"Verticale"}[k]; const mn=k==="scale"?1:0,mx=k==="scale"?6:100,st=k==="scale"?0.05:1; return <div key={k} style={{marginBottom:9}}><div style={{fontSize:11.5,color:C.gray,marginBottom:3,fontWeight:600}}>{lab}</div><input type="range" min={mn} max={mx} step={st} value={cfg[k]} onChange={e=>onSaveLogo(info.logo_url,{...cfg,[k]:parseFloat(e.target.value)})} style={{width:"100%",accentColor:C.blue}}/></div>; })}
          <div style={{display:"flex",gap:8,marginTop:10}}>
            <label style={{flex:1,textAlign:"center",background:C.blue,color:"#fff",borderRadius:9,padding:8,fontSize:13,fontWeight:700,cursor:"pointer"}}>{busy?"…":"Cambia"}<input type="file" accept="image/*" onChange={upload} style={{display:"none"}}/></label>
            <button onClick={()=>setAdjust(false)} style={{flex:1,background:C.cream,color:C.navy,border:"1px solid "+C.line,borderRadius:9,padding:8,fontSize:13,fontWeight:700,cursor:"pointer"}}>Fatto</button>
          </div>
        </div>
      )}
    </div>
  );
}

function Pill({c}){ return <span style={{background:catColor(c),color:"#fff",fontSize:11,fontWeight:700,padding:"3px 9px",borderRadius:6,textTransform:"uppercase",letterSpacing:.5}}>{c}</span>; }

function Card({item,big,admin,onOpen,onPlay,onEdit,onDelete,onCopy}){
  const yt=ytId(item.video);
  const cover=item.image? <img src={item.image} style={{width:"100%",height:"100%",objectFit:"cover"}}/> : yt? <img src={"https://img.youtube.com/vi/"+yt+"/hqdefault.jpg"} style={{width:"100%",height:"100%",objectFit:"cover"}}/> : <div style={{width:"100%",height:"100%",background:"linear-gradient(135deg,"+C.navy+","+C.blueDeep+")"}}/>;
  const open=()=>onOpen&&onOpen(item);
  const actions=admin&&(<div style={{display:"flex",gap:6}}>
    <button onClick={e=>{e.stopPropagation();onCopy&&onCopy(item);}} title="Copia link articolo" style={{background:"rgba(255,255,255,.92)",border:"1px solid "+C.line,borderRadius:8,padding:6,cursor:"pointer",display:"flex"}}><Ic n="link" s={14} c={C.navySoft}/></button>
    <button onClick={e=>{e.stopPropagation();onEdit(item);}} style={{background:"rgba(255,255,255,.92)",border:"1px solid "+C.line,borderRadius:8,padding:6,cursor:"pointer",display:"flex"}}><Ic n="edit" s={14} c={C.navySoft}/></button>
    <button onClick={e=>{e.stopPropagation(); if(confirm("Eliminare questa news?"))onDelete(item.id);}} style={{background:"rgba(255,255,255,.92)",border:"1px solid "+C.line,borderRadius:8,padding:6,cursor:"pointer",display:"flex"}}><Ic n="trash" s={14} c={C.red}/></button>
  </div>);
  const playBtn=item.video&&<button onClick={e=>{e.stopPropagation();onPlay(item);}} style={{position:"absolute",left:"50%",top:"50%",transform:"translate(-50%,-50%)",background:"rgba(27,156,217,.95)",border:"none",borderRadius:"50%",width:big?56:44,height:big?56:44,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer"}}><Ic n="play" s={big?24:18} c="#fff" fill="#fff"/></button>;
  const clampStyle=(lines)=>({display:"-webkit-box",WebkitLineClamp:lines,WebkitBoxOrient:"vertical",overflow:"hidden"});
  const meta=(<div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginTop:big?0:"auto"}}>
    <span style={{display:"flex",alignItems:"center",gap:5,fontSize:big?12.5:11.5,color:C.gray}}><Ic n="cal" s={big?13:12} c={C.gray}/> {fmtDate(item.date)}</span>
    {item.link&&<a href={item.link} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{display:"flex",alignItems:"center",gap:4,fontSize:big?12.5:11.5,color:C.blueDeep,textDecoration:"none",fontWeight:600}}>{platform(item.link)} <Ic n="ext" s={big?13:12} c={C.blueDeep}/></a>}
  </div>);

  if(big) return (
    <div onClick={open} style={{background:C.card,borderRadius:16,overflow:"hidden",border:"1px solid "+C.line,boxShadow:"0 4px 14px rgba(22,36,63,.06)",cursor:"pointer"}}>
      <div style={{position:"relative",aspectRatio:"16/9",background:C.navy}}>{cover}
        <div style={{position:"absolute",inset:0,background:"linear-gradient(to top, rgba(14,17,23,.85), transparent 60%)"}}/>
        <div style={{position:"absolute",top:12,left:12,display:"flex",gap:8,alignItems:"center"}}><Pill c={item.category}/><span style={{background:C.amber,color:C.navy,fontSize:10.5,fontWeight:800,padding:"3px 8px",borderRadius:6}}>IN EVIDENZA</span></div>
        {admin&&<div style={{position:"absolute",top:12,right:12}}>{actions}</div>}
        {playBtn}
        <div style={{position:"absolute",bottom:14,left:16,right:16}}><h2 style={{fontFamily:"Anton",color:"#F5F5F5",fontSize:"clamp(20px,5vw,30px)",margin:0,lineHeight:1.05}}>{item.title}</h2></div>
      </div>
      <div style={{padding:"14px 16px"}}>{item.subtitle? <p style={{margin:"0 0 10px",fontSize:15,color:C.navySoft,lineHeight:1.45,fontWeight:600}}>{item.subtitle}</p> : item.summary? <p style={{margin:"0 0 10px",fontSize:15,color:C.navySoft,lineHeight:1.45,...clampStyle(2)}}>{item.summary}</p> : null}{meta}</div>
    </div>
  );
  return (
    <div onClick={open} style={{background:C.card,borderRadius:14,overflow:"hidden",border:"1px solid "+C.line,display:"flex",flexDirection:"column",cursor:"pointer"}}>
      <div style={{position:"relative",aspectRatio:"16/10",background:C.navy}}>{cover}
        <div style={{position:"absolute",top:10,left:10}}><Pill c={item.category}/></div>
        {admin&&<div style={{position:"absolute",top:10,right:10}}>{actions}</div>}
        {playBtn}
      </div>
      <div style={{padding:"12px 14px",flex:1,display:"flex",flexDirection:"column"}}>
        <h3 style={{fontFamily:"Anton",color:C.navy,fontSize:18,margin:"0 0 6px",lineHeight:1.1}}>{item.title}</h3>
        {item.subtitle? <p style={{margin:"0 0 10px",fontSize:13.5,color:C.navySoft,lineHeight:1.4,fontWeight:600}}>{item.subtitle}</p> : item.summary? <p style={{margin:"0 0 10px",fontSize:13.5,color:C.navySoft,lineHeight:1.4,...clampStyle(3)}}>{item.summary}</p> : null}
        {meta}
      </div>
    </div>
  );
}

function ArticlePage({item,loading,onBack,onCopy,note}){
  useEffect(()=>{ if(item){ document.title=item.title+" · IAttualità"; const set=(p,v)=>{ let m=document.querySelector('meta[property="'+p+'"]'); if(!m){ m=document.createElement("meta"); m.setAttribute("property",p); document.head.appendChild(m);} m.setAttribute("content",v||""); }; set("og:title",item.title); set("og:description",item.subtitle||item.summary||""); set("og:type","article"); set("og:url",articleFullUrl(item)); if(item.image)set("og:image",item.image); } return ()=>{ document.title="IAttualità · L'informazione intelligente e in tempo reale"; }; },[item]);
  const backBtn=(<button onClick={onBack} style={{display:"inline-flex",alignItems:"center",gap:6,background:"none",border:"none",color:C.blueDeep,fontSize:14,fontWeight:700,cursor:"pointer",padding:"4px 0",marginBottom:12}}>‹ Torna alle news</button>);
  if(!item) return (<main style={{maxWidth:760,margin:"0 auto",padding:"40px 16px",textAlign:"center"}}>{loading? <div style={{color:C.gray}}>Caricamento…</div> : <React.Fragment><div style={{fontFamily:"Anton",fontSize:22,color:C.navy,marginBottom:8}}>Articolo non trovato</div><p style={{color:C.gray,marginBottom:16,fontSize:14.5}}>Il link potrebbe non essere più valido.</p>{backBtn}</React.Fragment>}</main>);
  const yt=ytId(item.video);
  const share=()=>{ const url=articleFullUrl(item); if(navigator.share){ navigator.share({title:item.title,text:item.subtitle||item.summary||"",url}).catch(()=>{}); } else { onCopy&&onCopy(item); } };
  return (
    <main style={{maxWidth:760,margin:"0 auto",padding:"18px 16px 8px"}}>
      {backBtn}
      <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10,flexWrap:"wrap"}}><Pill c={item.category}/><span style={{display:"flex",alignItems:"center",gap:5,fontSize:12.5,color:C.gray}}><Ic n="cal" s={13} c={C.gray}/> {fmtDate(item.date)}</span></div>
      <h1 style={{fontFamily:"Anton",fontSize:"clamp(26px,6vw,40px)",color:C.navy,margin:"0 0 12px",fontWeight:400,lineHeight:1.08,letterSpacing:.2}}>{item.title}</h1>
      {item.subtitle&&<p style={{fontSize:19,color:C.navy,lineHeight:1.4,margin:"0 0 16px",fontWeight:700}}>{item.subtitle}</p>}
      {(item.image||yt)&&<div style={{borderRadius:16,overflow:"hidden",marginBottom:18,background:C.navy}}>{item.image? <img src={item.image} style={{width:"100%",display:"block"}}/> : <img src={"https://img.youtube.com/vi/"+yt+"/hqdefault.jpg"} style={{width:"100%",display:"block"}}/>}</div>}
      {(item.body&&item.body.trim())? <div className="article-body" style={{fontSize:17,color:C.navySoft,lineHeight:1.7}} dangerouslySetInnerHTML={{__html:sanitizeHtml(item.body)}}/> : item.summary? <div style={{fontSize:17,color:C.navySoft,lineHeight:1.7,whiteSpace:"pre-line"}}>{item.summary}</div> : null}
      {item.video&&yt&&<div style={{marginTop:20,aspectRatio:"16/9",background:"#000",borderRadius:14,overflow:"hidden"}}><iframe src={"https://www.youtube.com/embed/"+yt} style={{width:"100%",height:"100%",border:"none"}} allowFullScreen/></div>}
      {item.video&&!yt&&<div style={{marginTop:20}}><a href={item.video} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,background:C.blue,color:"#fff",padding:"11px 20px",borderRadius:10,textDecoration:"none",fontWeight:700}}>Guarda il video su {platform(item.video)} <Ic n="ext" s={16} c="#fff"/></a></div>}
      {item.link&&<div style={{marginTop:20,paddingTop:16,borderTop:"1px solid "+C.line}}><a href={item.link} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,color:C.blueDeep,textDecoration:"none",fontWeight:700,fontSize:14.5}}>Vedi il post originale su {platform(item.link)} <Ic n="ext" s={14} c={C.blueDeep}/></a></div>}
      <div style={{marginTop:22,paddingTop:16,borderTop:"1px solid "+C.line}}>
        <div style={{fontSize:12.5,color:C.gray,marginBottom:6,fontWeight:700,letterSpacing:.3}}>LINK DIRETTO A QUESTO ARTICOLO</div>
        <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
          <input readOnly value={articleFullUrl(item)} onClick={e=>e.target.select()} style={{...inStyle,flex:"1 1 220px",fontSize:13}}/>
          <button onClick={()=>onCopy&&onCopy(item)} style={{background:C.blue,color:"#fff",border:"none",borderRadius:10,padding:"0 16px",fontWeight:700,fontSize:13.5,cursor:"pointer",whiteSpace:"nowrap"}}>Copia</button>
          <button onClick={share} style={{background:C.card,color:C.navy,border:"1px solid "+C.line,borderRadius:10,padding:"10px 14px",fontWeight:700,fontSize:13.5,cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,fontFamily:"Barlow"}}><Ic n="link" s={15} c={C.navy}/> Condividi</button>
        </div>
      </div>
      <div style={{marginTop:24}}><button onClick={onBack} style={{display:"inline-flex",alignItems:"center",gap:6,background:C.cream,border:"1px solid "+C.line,color:C.navy,fontSize:14,fontWeight:700,cursor:"pointer",padding:"10px 16px",borderRadius:10}}>‹ Torna alle news</button></div>
    </main>
  );
}

function VideoModal({item,onClose}){
  const yt=ytId(item.video);
  return (<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(14,17,23,.8)",zIndex:50,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:760,background:C.card,borderRadius:16,overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 16px",borderBottom:"1px solid "+C.line}}><strong style={{fontFamily:"Anton",color:C.navy,fontSize:18,fontWeight:400}}>{item.title}</strong><button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><Ic n="x" s={22} c={C.navy}/></button></div>
      {yt? <div style={{aspectRatio:"16/9",background:"#000"}}><iframe src={"https://www.youtube.com/embed/"+yt} style={{width:"100%",height:"100%",border:"none"}} allowFullScreen/></div>
        : <div style={{padding:32,textAlign:"center"}}><p style={{color:C.navySoft,marginBottom:16}}>I video di {platform(item.video)} si aprono nell'app originale.</p><a href={item.video} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,background:C.blue,color:"#fff",padding:"11px 20px",borderRadius:10,textDecoration:"none",fontWeight:700}}>Guarda su {platform(item.video)} <Ic n="ext" s={16} c="#fff"/></a></div>}
    </div>

function TbBtn({onClick,title,children,wide}){ return <button type="button" onMouseDown={e=>e.preventDefault()} onClick={onClick} title={title} style={{minWidth:wide?"auto":32,height:32,padding:wide?"0 10px":0,display:"inline-flex",alignItems:"center",justifyContent:"center",background:C.card,border:"1px solid "+C.line,borderRadius:8,cursor:"pointer",fontSize:14,fontWeight:700,color:C.navy,fontFamily:"Barlow"}}>{children}</button>; }

function RichEditor({value,onChange}){
  const ref=React.useRef(null);
  useEffect(()=>{ if(ref.current) ref.current.innerHTML=value||""; },[]);
  const emit=()=>{ if(ref.current) onChange(ref.current.innerHTML); };
  const run=(command,val)=>{ if(ref.current)ref.current.focus(); try{ document.execCommand("styleWithCSS",false,true); }catch(e){} try{ document.execCommand(command,false,val); }catch(e){} emit(); };
  const size=(s)=>{ if(s)run("fontSize",s); };
  const font=(fam)=>{ if(fam)run("fontName",fam); };
  const link=()=>{ const u=window.prompt("Indirizzo del link (https://…)"); if(u)run("createLink",u); };
  const image=()=>{ const u=window.prompt("Indirizzo dell'immagine (https://…)"); if(u)run("insertImage",u); };
  const selStyle={height:32,border:"1px solid "+C.line,borderRadius:8,background:C.card,color:C.navy,fontFamily:"Barlow",fontSize:13,fontWeight:600,padding:"0 6px",cursor:"pointer"};
  const swatch={width:32,height:32,border:"1px solid "+C.line,borderRadius:8,background:C.card,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",position:"relative"};
  const Sep=()=> <span style={{width:1,height:24,background:C.line,margin:"0 3px",alignSelf:"center"}}/>;
  return (
    <div style={{border:"1px solid "+C.line,borderRadius:10,overflow:"hidden",background:C.cream}}>
      <div onMouseDown={e=>e.preventDefault()} style={{display:"flex",flexWrap:"wrap",gap:4,alignItems:"center",padding:8,borderBottom:"1px solid "+C.line,background:"#F7F5EF"}}>
        <TbBtn onClick={()=>run("undo")} title="Annulla"><Ic n="undo" s={16} c={C.navy}/></TbBtn>
        <TbBtn onClick={()=>run("redo")} title="Ripeti"><Ic n="redo" s={16} c={C.navy}/></TbBtn>
        <Sep/>
        <TbBtn onClick={()=>run("bold")} title="Grassetto"><b>B</b></TbBtn>
        <TbBtn onClick={()=>run("italic")} title="Corsivo"><i>I</i></TbBtn>
        <TbBtn onClick={()=>run("underline")} title="Sottolineato"><span style={{textDecoration:"underline"}}>U</span></TbBtn>
        <TbBtn onClick={()=>run("strikeThrough")} title="Barrato"><s>S</s></TbBtn>
        <label title="Colore testo" style={swatch}><span style={{fontWeight:800,fontSize:13,color:C.red}}>A</span><input type="color" defaultValue="#E2231A" onChange={e=>run("foreColor",e.target.value)} style={{position:"absolute",inset:0,opacity:0,cursor:"pointer"}}/></label>
        <label title="Evidenziatore" style={{...swatch,background:"#FFF3B0"}}><span style={{fontWeight:800,fontSize:13,color:C.navy}}>A</span><input type="color" defaultValue="#FFE55C" onChange={e=>run("hiliteColor",e.target.value)} style={{position:"absolute",inset:0,opacity:0,cursor:"pointer"}}/></label>
        <Sep/>
        <select onChange={e=>{size(e.target.value); e.target.selectedIndex=0;}} title="Dimensione testo" style={selStyle}><option value="">Dimensione</option><option value="1">Molto piccolo</option><option value="2">Piccolo</option><option value="3">Normale</option><option value="4">Medio</option><option value="5">Grande</option><option value="6">Molto grande</option><option value="7">Enorme</option></select>
        <select onChange={e=>{font(e.target.value); e.target.selectedIndex=0;}} title="Carattere" style={selStyle}><option value="">Carattere</option><option value="Barlow">Barlow</option><option value="Georgia, serif">Georgia</option><option value="Times New Roman, serif">Times</option><option value="Arial, sans-serif">Arial</option><option value="Courier New, monospace">Monospazio</option></select>
        <Sep/>
        <TbBtn onClick={()=>run("formatBlock","H2")} title="Titolo di sezione" wide>Titolo</TbBtn>
        <TbBtn onClick={()=>run("formatBlock","H3")} title="Sottotitolo di sezione" wide>Sottot.</TbBtn>
        <TbBtn onClick={()=>run("formatBlock","P")} title="Testo normale" wide>Normale</TbBtn>
        <TbBtn onClick={()=>run("formatBlock","BLOCKQUOTE")} title="Citazione" wide>Citazione</TbBtn>
        <Sep/>
        <TbBtn onClick={()=>run("insertUnorderedList")} title="Elenco puntato">•</TbBtn>
        <TbBtn onClick={()=>run("insertOrderedList")} title="Elenco numerato">1.</TbBtn>
        <TbBtn onClick={()=>run("outdent")} title="Riduci rientro">⇤</TbBtn>
        <TbBtn onClick={()=>run("indent")} title="Aumenta rientro">⇥</TbBtn>
        <Sep/>
        <TbBtn onClick={()=>run("justifyLeft")} title="Allinea a sinistra"><Ic n="alignLeft" s={16} c={C.navy}/></TbBtn>
        <TbBtn onClick={()=>run("justifyCenter")} title="Centra"><Ic n="alignCenter" s={16} c={C.navy}/></TbBtn>
        <TbBtn onClick={()=>run("justifyRight")} title="Allinea a destra"><Ic n="alignRight" s={16} c={C.navy}/></TbBtn>
        <TbBtn onClick={()=>run("justifyFull")} title="Giustifica"><Ic n="alignJustify" s={16} c={C.navy}/></TbBtn>
        <Sep/>
        <TbBtn onClick={link} title="Inserisci link"><Ic n="link" s={15} c={C.navy}/></TbBtn>
        <TbBtn onClick={()=>run("unlink")} title="Rimuovi link" wide>Togli link</TbBtn>
        <TbBtn onClick={image} title="Inserisci immagine (URL)"><Ic n="image" s={15} c={C.navy}/></TbBtn>
        <TbBtn onClick={()=>run("insertHorizontalRule")} title="Linea divisoria">―</TbBtn>
        <Sep/>
        <TbBtn onClick={()=>run("removeFormat")} title="Rimuovi formattazione">⌫</TbBtn>
      </div>
      <div ref={ref} contentEditable suppressContentEditableWarning onInput={emit} onBlur={emit} className="rich-input" style={{minHeight:220,maxHeight:420,overflowY:"auto",padding:"12px 14px",fontSize:15,lineHeight:1.6,color:C.navy,outline:"none",fontFamily:"Barlow",background:C.cream}}/>
    </div>
  );
}

        <div><label style={labStyle}>Facebook</label><input style={inStyle} value={f.facebook||""} onChange={e=>set("facebook",e.target.value)} placeholder="https://facebook.com/iattualita"/></div>
        <div><label style={labStyle}>YouTube</label><input style={inStyle} value={f.youtube||""} onChange={e=>set("youtube",e.target.value)} placeholder="https://youtube.com/@iattualita"/></div>
        <div><label style={labStyle}>Threads</label><input style={inStyle} value={f.threads||""} onChange={e=>set("threads",e.target.value)} placeholder="https://threads.net/@iattualita"/></div>
        <div style={{fontSize:12.5,fontWeight:800,color:C.gray,letterSpacing:.5,textTransform:"uppercase"}}>Contatti</div>
        <div><label style={labStyle}>Email</label><input style={inStyle} value={f.email||""} onChange={e=>set("email",e.target.value)} placeholder="info@iattualita.it"/></div>
        <div><label style={labStyle}>Telefono (opzionale)</label><input style={inStyle} value={f.phone||""} onChange={e=>set("phone",e.target.value)} placeholder="+39 …"/></div>
        <button onClick={()=>onSave(f)} style={{background:C.blue,color:"#fff",border:"none",borderRadius:12,padding:13,fontWeight:700,fontSize:16,cursor:"pointer",marginTop:4}}>Salva</button>
      </div>
    </div>
  </div>);
}

function LoginModal({onClose,onLogin}){
  const [email,setEmail]=useState("");
  const [pw,setPw]=useState("");
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const submit=async()=>{ setErr(""); setBusy(true); try{ await onLogin(email.trim(),pw); }catch(e){ setErr(e.message||"Accesso non riuscito."); } setBusy(false); };
  return (<div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(14,17,23,.55)",zIndex:60,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div onClick={e=>e.stopPropagation()} style={{width:"100%",maxWidth:380,background:C.card,borderRadius:16,padding:20}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}><strong style={{fontFamily:"Anton",color:C.navy,fontSize:20,fontWeight:400}}>Accesso redazione</strong><button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer"}}><Ic n="x" s={22} c={C.navy}/></button></div>
      <p style={{color:C.navySoft,fontSize:14,marginTop:0}}>Entra con l'email e la password della redazione.</p>
      <input value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} placeholder="Email" style={{...inStyle,marginBottom:10}}/>
      <input type="password" value={pw} onChange={e=>{setPw(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="Password" style={{...inStyle,marginBottom:10}}/>
      {err&&<div style={{color:C.red,fontSize:13,marginBottom:10}}>{err}</div>}
      <button onClick={submit} disabled={busy} style={{width:"100%",background:C.blue,color:"#fff",border:"none",borderRadius:11,padding:12,fontWeight:700,fontSize:15,cursor:"pointer"}}>{busy?"Accesso…":"Accedi"}</button>
    </div>
  </div>);
}

function Empty({admin,gate,hasNews,onAdd,onLogin}){
  return (<div style={{textAlign:"center",padding:"50px 20px",background:C.card,borderRadius:16,border:"1px dashed "+C.line}}>
    <div style={{fontFamily:"Anton",fontSize:22,color:C.navy,marginBottom:8}}>{hasNews?"Nessun risultato":"L'hub è ancora vuoto"}</div>
    <p style={{color:C.gray,marginBottom:18,fontSize:14.5}}>{hasNews?"Prova a cambiare filtro o ricerca.":admin?"Aggiungi la prima news.":"Le news appariranno qui appena la redazione le pubblica."}</p>
    {!hasNews&&(admin? <button onClick={onAdd} style={{display:"inline-flex",alignItems:"center",gap:7,background:C.blue,color:"#fff",border:"none",borderRadius:11,padding:"11px 18px",fontWeight:700,fontSize:15,cursor:"pointer"}}><Ic n="plus" s={18} c="#fff"/> Aggiungi news</button>
      : gate? <button onClick={onLogin} style={{display:"inline-flex",alignItems:"center",gap:7,background:C.navy,color:"#fff",border:"none",borderRadius:11,padding:"11px 18px",fontWeight:700,fontSize:15,cursor:"pointer"}}><Ic n="lock" s={16} c="#fff"/> Accesso redazione</button>
      : null)}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
