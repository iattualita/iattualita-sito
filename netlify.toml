# app.js e' generato da app.jsx: Netlify lo ricompila a ogni deploy.
# Senza questo blocco il bundle andava caricato a mano e restava indietro
# rispetto al sorgente (e' successo: modifiche del 24 agosto mai andate online).
# Il comando e' lo stesso di "npm run build" in locale, stessi flag.
[build]
  command = "npm run build"
  # dist/ e non ".": pubblicando la radice finivano online anche
  # node_modules (esbuild e React erano scaricabili), package-lock.json,
  # i test, le migrazioni SQL e il sorgente app.jsx. scripts/prepara-dist.mjs
  # ci copia dentro solo cio' che il sito serve davvero.
  publish = "dist"
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Fa in modo che aprendo direttamente iattualita.it/articolo/123/slug
# Netlify serva l'app (index.html) invece di un errore 404.
# Le edge function (og-meta, sitemap) vengono registrate automaticamente
# dai file in netlify/edge-functions/.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

 [images]
  remote_images = [
    "https://wzkshpgakvasqwrrgkgd.supabase.co/.*",
    "https://img.youtube.com/.*"
  ]
